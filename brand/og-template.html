<!DOCTYPE html>
<!-- Source template for brand/og-image.png. Rendered at 1200x630 in Chrome and screenshotted. -->
<html lang="ru">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .og{position:relative;width:1200px;height:630px;background:#0c0a0b;
      font-family:'Manrope',system-ui,sans-serif;overflow:hidden}
  .og::before{content:"";position:absolute;inset:0;
      background:radial-gradient(60% 90% at 100% 0%, rgba(226,55,68,.22), transparent 60%)}
  .inner{position:relative;z-index:1;width:100%;height:100%;
      padding:72px 76px;display:flex;flex-direction:column;justify-content:space-between}
  /* logo lockup */
  .brand{display:flex;flex-direction:column;gap:12px}
  .lockup{display:flex;align-items:center;gap:24px}
  .brand-mark{height:98px;width:auto;display:block}
  .brand-word{font-family:'PT Serif',Georgia,serif;font-weight:700;font-size:90px;
      line-height:.86;letter-spacing:.02em;color:#e23744}
  .brand-tag{font-family:'Manrope',sans-serif;font-weight:600;font-size:27px;
      letter-spacing:.02em;color:#e23744;padding-left:104px}
  /* headline */
  .headline{font-family:'Manrope',sans-serif;font-weight:600;font-size:66px;
      line-height:1.12;letter-spacing:-.015em;color:#f4f1f1}
  /* footer */
  .foot{}
  .divider{height:1px;width:100%;background:rgba(255,255,255,.12);margin-bottom:28px}
  .services{font-family:'Manrope',sans-serif;font-weight:500;font-size:30px;
      letter-spacing:.005em;color:#a39d9e}
  .handle{font-family:'Manrope',sans-serif;font-weight:500;font-size:26px;
      color:#726c6d;margin-top:14px}
</style>
</head>
<body>
<div class="og">
  <div class="inner">
    <div class="brand">
      <div class="lockup">
        <img class="brand-mark" src="/brand/sits-mark-red.png" alt="" />
        <div class="brand-word">SITS</div>
      </div>
      <div class="brand-tag">Sariyev IT Solutions</div>
    </div>
    <div class="headline">Превращаем идеи<br/>в цифровые продукты</div>
    <div class="foot">
      <div class="divider"></div>
      <div class="services">Сайты · приложения · игры · автоматизация · AI-контент</div>
      <div class="handle">sariyev-it-solutions</div>
    </div>
  </div>
</div>
</body>
</html>
